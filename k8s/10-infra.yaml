apiVersion: v1
kind: ConfigMap
metadata: { name: app-config, namespace: disaster }
data:
  KAFKA_BROKER: "redpanda:9092"
  DATABASE_URL: "postgresql://disaster:disaster@postgres:5432/disasterdb"
  API_KEY: "change-me-demo-key"
  RISK_ALERT_THRESHOLD: "0.6"
  SEVERITY_ALERT_THRESHOLD: "60"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: disaster }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          env:
            - { name: POSTGRES_USER, value: disaster }
            - { name: POSTGRES_PASSWORD, value: disaster }
            - { name: POSTGRES_DB, value: disasterdb }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: init, mountPath: /docker-entrypoint-initdb.d }]
      volumes:
        - name: init
          configMap: { name: db-init }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: disaster }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redpanda, namespace: disaster }
spec:
  replicas: 1
  selector: { matchLabels: { app: redpanda } }
  template:
    metadata: { labels: { app: redpanda } }
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.1.1
          args: ["redpanda","start","--smp","1","--memory","512M","--overprovisioned","--node-id","0",
                 "--kafka-addr","PLAINTEXT://0.0.0.0:9092","--advertise-kafka-addr","PLAINTEXT://redpanda:9092",
                 "--mode","dev-container"]
          ports: [{ containerPort: 9092 }]
---
apiVersion: v1
kind: Service
metadata: { name: redpanda, namespace: disaster }
spec: { selector: { app: redpanda }, ports: [{ port: 9092 }] }
