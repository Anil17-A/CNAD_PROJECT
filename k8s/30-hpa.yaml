---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ingestion, namespace: disaster }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ingestion }
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
