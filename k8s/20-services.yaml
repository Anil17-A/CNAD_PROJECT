---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ingestion, namespace: disaster }
spec:
  replicas: 1
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: ingestion } }
  template:
    metadata: { labels: { app: ingestion } }
    spec:
      containers:
        - name: ingestion
          image: disaster/ingestion:latest
          imagePullPolicy: IfNotPresent
          envFrom: [{ configMapRef: { name: app-config } }]
          ports: [{ containerPort: 8000 }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 15, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: ingestion, namespace: disaster }
spec: { selector: { app: ingestion }, ports: [{ port: 8000, targetPort: 8000 }] }
